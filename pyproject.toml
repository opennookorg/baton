[project]
name = "baton"
version = "0.1.0"
description = "An issue router that learns which team owns what, on a HydraDB graph."
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "locust>=2.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
