services:
  baton:
    build: .
    image: baton:latest
    platform: linux/amd64
    ports:
      - "8000:7860"
    environment:
      BATON_LEARN_TOKEN: ${BATON_LEARN_TOKEN:?set BATON_LEARN_TOKEN in .env}
    mem_limit: 2g
    cpus: 1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 3
